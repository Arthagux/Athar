name: Build ATHAR Android APK
# local-ai build revision 4
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Create stable ATHAR development signing key
        run: |
          mkdir -p keystore
          cat > keystore/athar-dev.b64 <<'EOF'

EOF
          base64 -d keystore/athar-dev.b64 > keystore/athar-dev.jks
          rm keystore/athar-dev.b64
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          log-accepted-android-sdk-licenses: false
      - name: Install Android native toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
      - name: Get official llama.cpp Android runtime
        run: |
          mkdir -p vendor
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp
      - name: Adapt llama.cpp library to ATHAR Android 11 build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vendor/llama.cpp/examples/llama.android/lib/build.gradle.kts")
          s = p.read_text()
          s = s.replace("alias(libs.plugins.android.library)", 'id("com.android.library")')
          s = s.replace("alias(libs.plugins.jetbrains.kotlin.android)", 'id("org.jetbrains.kotlin.android")')
          s = s.replace("minSdk = 33", "minSdk = 30")
          s = s.replace('abiFilters += listOf("arm64-v8a", "x86_64")', 'abiFilters += listOf("armeabi-v7a", "arm64-v8a")')
          s = s.replace("implementation(libs.androidx.core.ktx)", 'implementation("androidx.core:core-ktx:1.17.0")')
          s = s.replace("implementation(libs.androidx.datastore.preferences)", 'implementation("androidx.datastore:datastore-preferences:1.1.7")')
          s = s.replace("testImplementation(libs.junit)", 'testImplementation("junit:junit:4.13.2")')
          s = s.replace("androidTestImplementation(libs.androidx.junit)", 'androidTestImplementation("androidx.test.ext:junit:1.3.0")')
          p.write_text(s)
          PY
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build install-safe Android 11 APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ATHAR-v0.3.2-android11-install-fix.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATHAR-v0.3.2-android11-install-fix
          path: ATHAR-v0.3.2-android11-install-fix.apk
          if-no-files-found: error
