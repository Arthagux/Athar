name: RADAR SILUETA KINECT v0.3.0 APK
on:
  push:
    branches:
      - radar-silueta-kinect-v030-20261106
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Descargar proyecto Kinect v0.3.0
        run: |
          mkdir -p /tmp/radar
          curl --retry 4 --fail --location --show-error --output /tmp/radar-source.zip "https://bc271775-a72d-49cf-8288-451773dbf01b.sandbox.floot.app/_cdn/static/6e88b804-f5af-4edc-9de5-37ecd6e9b14a-radar-silueta-kinect-v030-source.zip"
          test "$(stat -c %s /tmp/radar-source.zip)" -gt 20000
          unzip -q /tmp/radar-source.zip -d /tmp/radar
          test -f /tmp/radar/Radar-Silueta-Kinect-v0.3.0/app/build.gradle.kts
      - name: Compilar APK Kinect
        working-directory: /tmp/radar/Radar-Silueta-Kinect-v0.3.0
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verificar archivo
        run: |
          test -s /tmp/radar/Radar-Silueta-Kinect-v0.3.0/app/build/outputs/apk/debug/app-debug.apk
          ls -lh /tmp/radar/Radar-Silueta-Kinect-v0.3.0/app/build/outputs/apk/debug/app-debug.apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RADAR-SILUETA-KINECT-v0.3.0-APK
          path: /tmp/radar/Radar-Silueta-Kinect-v0.3.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
