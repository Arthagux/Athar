name: RADAR SILUETA KINECT PRO v0.4.0 APK
on:
  push:
    branches:
      - radar-silueta-kinect-pro-v040-20261106
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Descargar proyecto v0.4.0
        run: |
          mkdir -p /tmp/radar
          curl --retry 4 --fail --location --show-error --output /tmp/radar-source.zip "https://bc271775-a72d-49cf-8288-451773dbf01b.sandbox.floot.app/_cdn/static/54284cc4-6f3b-4538-859a-263dfe38084f-radar-silueta-kinect-pro-v040-source.zip"
          test "$(stat -c %s /tmp/radar-source.zip)" -gt 22000
          unzip -q /tmp/radar-source.zip -d /tmp/radar
          test -f /tmp/radar/Radar-Silueta-Kinect-v0.4.0/app/build.gradle.kts
      - name: Compilar APK Kinect Pro
        working-directory: /tmp/radar/Radar-Silueta-Kinect-v0.4.0
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verificar APK y modelos
        run: |
          test -s /tmp/radar/Radar-Silueta-Kinect-v0.4.0/app/build/outputs/apk/debug/app-debug.apk
          unzip -l /tmp/radar/Radar-Silueta-Kinect-v0.4.0/app/build/outputs/apk/debug/app-debug.apk | grep 'pose_landmarker_'
          ls -lh /tmp/radar/Radar-Silueta-Kinect-v0.4.0/app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: RADAR-SILUETA-KINECT-PRO-v0.4.0-APK
          path: /tmp/radar/Radar-Silueta-Kinect-v0.4.0/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
